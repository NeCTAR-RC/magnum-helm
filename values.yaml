# Default values for magnum.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.


conf:
  debug: false
  keystone:
    auth_url:
    username: magnum
    project_name: service
    memcached_servers: []
    region_name:
  trust:
    trustee_domain_name: magnum
    trustee_domain_admin_name: magnum_domain_admin
  quotas:
    max_clusters_per_project: 20

vault:
  role: k8s
  settings_secret: 'path/to/secret/in/vault'
  kubeconfig_secret: 'path/to/kubeconfig/in/vault'

# Sentry/GlitchTip error reporting via the shim in the kolla images.
# When enabled, the vault agent renders the sentry_dsn key of
# vault.settings_secret into env_file, and nectarlib injects the
# SENTRY_* env vars into every container. Set environment (and
# optionally tags) per site.
sentry:
  enabled: false
  env_file: /vault/secrets/sentry.env
  # environment: production-melbourne
  # tags: {}

api:
  port: 9511
  uwsgi:
    enabled: true
    module: magnum.wsgi.api:application
  image:
    repository: registry.rc.nectar.org.au/kolla/ubuntu-source-magnum-api
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  gateway:
    enabled: false
    annotations: {}
    hostname: chart-example.local
    parentRefs:
      - name: default

conductor:
  name: conductor
  command:
    - magnum-conductor
  image:
    repository: registry.rc.nectar.org.au/kolla/ubuntu-source-magnum-conductor
  replicaCount: 1
  pdb:
    enabled: false
    minAvailable: 1
  podAffinityPreset: ""
  podAntiAffinityPreset: soft
  nodeAffinityPreset:
    type: ""
    key: ""
    values: []
  affinity: {}
  resources: {}
  volumes:
    - name: tmp
      emptyDir: {}
    - name: lib-magnum
      emptyDir: {}
  volume_mounts:
    - name: tmp
      mountPath: /tmp
    - name: lib-magnum
      mountPath: /var/lib/magnum/

job:
  db_sync:
    enabled: true
    command:
      - magnum-db-manage
    args:
      - upgrade

oslo_policy:
  certificate:create: 'rule:admin_or_project_member_user or rule:cluster_user'
  certificate:get: 'rule:admin_or_project_reader_user or rule:cluster_user'

image:
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "1"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 42428
  runAsGroup: 42428
  fsGroup: 42428
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

# capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP


autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []
